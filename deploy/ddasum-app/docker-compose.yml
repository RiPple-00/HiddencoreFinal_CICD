# APP 서버 — Spring Boot (동적 배포: GitHub Actions → docker compose)
services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.cloud
    image: ddasum-backend:latest
    container_name: ddasum-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ${UPLOAD_HOST_DIR:-/data/ddasum/uploads}:/data/ddasum/uploads
      - ${DDASUM_AI_DIR:-/home/rocky/ddasum-repo/ai}:/ai:ro
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SERVER_PORT: "8080"
      APP_GALLERY_UPLOAD_DIR: /data/ddasum/uploads
      APP_GALLERY_FACE_AI_HOME: /ai/dasum-face-ai-test
      APP_GALLERY_AI_SERVER_HOME: /ai/ai-server
      PYTHON_EXECUTABLE: python3
      INSIGHTFACE_HOME: /home/appuser/.insightface
      YOLO_CONFIG_DIR: /tmp/ultralytics
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/swagger-ui.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
