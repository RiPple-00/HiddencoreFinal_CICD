name: Deploy AI (Docker)

on:
  push:
    branches: [main, master]
    paths:
      - "ai/**"
      - "deploy/ddasum-ai/**"
      - "deploy/scripts/**"
      - ".github/workflows/deploy-ai.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, ddasum-ai]
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync repository to ~/ddasum-repo
        run: bash deploy/scripts/sync-repo-from-github.sh "${{ github.ref_name }}"

      - name: Write secrets .env and deploy
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          CHATBOT_DAILY_MAX: ${{ secrets.CHATBOT_DAILY_MAX }}
          AI_REPORT_DAILY_MAX: ${{ secrets.AI_REPORT_DAILY_MAX }}
        run: bash ~/ddasum-repo/deploy/scripts/remote-up-all.sh ai
