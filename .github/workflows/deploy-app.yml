name: Deploy APP (Docker)

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "deploy/ddasum-app/**"
      - "deploy/scripts/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, ddasum-app]
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync repository to ~/ddasum-repo
        run: bash deploy/scripts/sync-repo-from-github.sh "${{ github.ref_name }}"

      - name: Write secrets .env and deploy (Docker)
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_REPORT_URL: ${{ secrets.AI_REPORT_URL }}
          AI_SERVER_URL: ${{ secrets.AI_SERVER_URL }}
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
        run: bash ~/ddasum-repo/deploy/scripts/remote-up-all.sh app

      - name: Reset demo DB and reseed (로컬과 동일 더미)
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: bash ~/ddasum-repo/deploy/scripts/reset-cloud-demo-and-restart.sh
