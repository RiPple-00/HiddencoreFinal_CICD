# 전체 서버 안전 재배포 — DB 초기화 없음, 업로드·MySQL 데이터 유지
name: Deploy ALL (safe, no DB reset)

on:
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.WEB_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repository on WEB server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WEB_HOST: ${{ secrets.WEB_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${WEB_HOST}" \
            "bash -s master" < deploy/scripts/sync-repo-from-github.sh

      - name: Docker compose build & up (WEB)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WEB_HOST: ${{ secrets.WEB_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${WEB_HOST}" \
            'bash ~/ddasum-repo/deploy/scripts/remote-up-all.sh web'

  deploy-app:
    needs: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.APP_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repository on APP server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=40 \
            -o TCPKeepAlive=yes \
            "${DEPLOY_USER}@${APP_HOST}" \
            "bash -s master" < deploy/scripts/sync-repo-from-github.sh

      - name: Write secrets .env and deploy (APP, no DB reset)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_HOST: ${{ secrets.APP_HOST }}
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_REPORT_URL: ${{ secrets.AI_REPORT_URL }}
          AI_SERVER_URL: ${{ secrets.AI_SERVER_URL }}
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=40 \
            -o TCPKeepAlive=yes \
            "${DEPLOY_USER}@${APP_HOST}" \
            "export MYSQL_URL='${MYSQL_URL}' MYSQL_USERNAME='${MYSQL_USERNAME}' MYSQL_PASSWORD='${MYSQL_PASSWORD}' JWT_SECRET='${JWT_SECRET}' AI_REPORT_URL='${AI_REPORT_URL}' AI_SERVER_URL='${AI_SERVER_URL}' PUBLIC_DATA_SERVICE_KEY='${PUBLIC_DATA_SERVICE_KEY}' && \
             bash ~/ddasum-repo/deploy/scripts/remote-up-all.sh app"

  deploy-ai:
    needs: deploy-app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.AI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repository on AI server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          AI_HOST: ${{ secrets.AI_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${AI_HOST}" \
            "bash -s master" < deploy/scripts/sync-repo-from-github.sh

      - name: Write secrets .env and deploy (AI)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          AI_HOST: ${{ secrets.AI_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          CHATBOT_DAILY_MAX: ${{ secrets.CHATBOT_DAILY_MAX }}
          AI_REPORT_DAILY_MAX: ${{ secrets.AI_REPORT_DAILY_MAX }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${AI_HOST}" \
            "export OPENAI_API_KEY='${OPENAI_API_KEY}' OPENAI_MODEL='${OPENAI_MODEL:-gpt-4o-mini}' CHATBOT_DAILY_MAX='${CHATBOT_DAILY_MAX:-50}' AI_REPORT_DAILY_MAX='${AI_REPORT_DAILY_MAX:-15}' && \
             bash ~/ddasum-repo/deploy/scripts/remote-up-all.sh ai"
