name: Deploy WEB (Docker)

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "frontend-app/**"
      - "deploy/ddasum-web/**"
      - "deploy/scripts/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    # GitHub 클라우드 러너는 서버 SSH(22) 방화벽에 막힘 → WEB 서버 self-hosted runner 필요
    runs-on: [self-hosted, linux, ddasum-web]
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync repository to ~/ddasum-repo
        run: bash deploy/scripts/sync-repo-from-github.sh "${{ github.ref_name }}"

      - name: Docker compose build & up
        run: bash ~/ddasum-repo/deploy/scripts/remote-up-all.sh web
