server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML은 항상 최신 (JS 해시 변경 시 index 갱신)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Expo Web SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot API (APP 서버 사설 IP)
    location /api/ {
        proxy_pass http://192.168.0.181:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 활동 사진
    location /uploads/ {
        proxy_pass http://192.168.0.181:8080/uploads/;
        proxy_set_header Host $host;
    }

    # 챗봇 FastAPI (AI 서버 8001) — /chatbot/chat → AI:8001/chat
    location /chatbot/ {
        proxy_pass http://192.168.0.163:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
