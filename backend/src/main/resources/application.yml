spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    # 로컬 DB/JWT는 application-local.yml (운영은 SPRING_PROFILES_ACTIVE 로 덮어쓰기)
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: ddasum
  datasource:
    # 실제 비밀번호는 application-local.yml 또는 환경 변수 MYSQL_PASSWORD 로 설정
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ddasum?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  jpa:
    hibernate:
      # 로컬: 엔티티와 테이블 스키마 동기화 (meal_plan에 calorie/protein 등 반영)
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # localhost 스펙을 외부 validator.swagger.io 가 검증하지 못해 빨간 오류 배지가 뜨는 것을 막음
    validator-url: ""
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

server:
  # 기본 API 포트는 8080 사용 (필요 시 SERVER_PORT 로 덮어쓰기)
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

# JWT: 운영에서는 JWT_SECRET 환경변수로 32바이트 이상(권장 64자+) 설정
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    # true면 SMTP 대신 로그만 출력 (로컬 개발)
    log-only: ${APP_MAIL_LOG_ONLY:true}
  ai-report:
    enabled: ${AI_REPORT_ENABLED:true}
    base-url: ${AI_REPORT_URL:http://127.0.0.1:8002}
  llm:
    weekly-report:
      enabled: ${APP_LLM_WEEKLY_REPORT_ENABLED:true}
  translation:
    enabled: true
    cache-type: caffeine
    cache-ttl-seconds: 3600
    cache-maximum-size: 5000
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-3.5-turbo}
      api-url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
      temperature: 0.0
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
  gallery:
    demo-patient-id: ${GALLERY_DEMO_PATIENT_ID:260401008}
    ai-server-base-url: ${AI_SERVER_URL:http://127.0.0.1:8000}
    upload-dir: ${UPLOAD_DIR:uploads}
    ai-server-home: ${AI_SERVER_HOME:../ai/ai-server}
    face-ai-home: ${FACE_AI_HOME:../ai/dasum-face-ai-test}
    python-executable: ${PYTHON_EXECUTABLE:python}

# 복약 QR — 공공데이터 API 키는 application-local.yml 에 설정 (Git 제외)
public-data:
  service-key: ${PUBLIC_DATA_SERVICE_KEY:}
hira:
  api:
    service-key: ${HIRA_API_SERVICE_KEY:${public-data.service-key:}}
openapi:
  mfds:
    service-key: ${OPENAPI_MFDS_SERVICE_KEY:${public-data.service-key:}}
mfds:
  dur:
    service-key: ${MFDS_DUR_SERVICE_KEY:${public-data.service-key:}}
  permit:
    service-key: ${MFDS_PERMIT_SERVICE_KEY:${public-data.service-key:}}
drug:
  api:
    service-key: ${DRUG_API_SERVICE_KEY:${public-data.service-key:}}
